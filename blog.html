<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog | SPACE</title><link rel="stylesheet" href="css/style.css"></head><body>
<main class="wrap">
<h1>Blog</h1><label>Search posts<input id="q" type="search" placeholder="Type to filter"></label><div id="list"></div>
</main>
<script src="js/config.js"></script><script src="js/site.js"></script>
<script>function draw(){const t=q.value.toLowerCase();list.innerHTML=S.posts.filter(p=>(p.title+" "+p.summary).toLowerCase().includes(t)).map(p=>`<div class="item"><a href="post.html?id=${encodeURIComponent(p.id)}">${esc(p.title)}</a><p class="muted">${esc(p.date)}: ${esc(p.summary)}</p></div>`).join("")||`<p class="muted">No posts match.</p>`}q.addEventListener("input",draw);draw()</script>
</body></html>
